<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ลงเวลาพนักงาน BP</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fc;color:#123456;font-family:Prompt,"Segoe UI",sans-serif}button{font:inherit}button:focus-visible{outline:3px solid #80b4ec;outline-offset:3px}main{width:min(640px,100%);margin:auto;padding:32px 20px 48px}.eyebrow{margin:0 0 8px;color:#6b86a4;font-size:12px}.employee-name{margin:0;font-size:25px;line-height:1.3;color:#102f51}.branch{margin:6px 0 24px;color:#7087a2;font-size:13px}.clock-card{overflow:hidden;border:1px solid #d7e2ef;border-radius:20px;background:#fff;box-shadow:0 12px 34px #2446680d}.clock-head{padding:34px 24px 26px;text-align:center}.clock{display:flex;align-items:flex-end;justify-content:center;color:#092d57;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}.clock-main{font-size:clamp(62px,17vw,86px);letter-spacing:-5px}.clock-seconds{margin:0 0 5px 5px;font-size:34px;letter-spacing:-2px}.date{margin-top:18px;font-size:13px;color:#375875}.location-card{margin:0 20px 18px;overflow:hidden;border:1px solid #d9e3ee;border-radius:14px;background:#f7f9fc}.location-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px}.location-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}.pin{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e6f1ff;color:#1760a9}.location-state{margin:3px 0 0;color:#718499;font-size:11px;font-weight:400}.refresh-location{min-height:36px;padding:0 12px;border:1px solid #c8d6e5;border-radius:9px;background:#fff;color:#23517d;cursor:pointer}.map-wrap{position:relative;height:180px;border-top:1px solid #d9e3ee;background:linear-gradient(135deg,#e9f0f7,#f6f8fb)}.map-wrap iframe{width:100%;height:100%;border:0}.map-empty{position:absolute;inset:0;display:grid;place-content:center;gap:6px;padding:20px;text-align:center;color:#678098;font-size:12px}.map-empty strong{color:#274c70;font-size:14px}.accuracy{padding:9px 15px;background:#fff;color:#668097;font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 18px}.attendance-action{display:grid;gap:6px;place-content:center;min-height:112px;padding:14px;border:0;border-radius:14px;color:#fff;cursor:pointer;box-shadow:0 7px 16px #25486824;transition:transform .15s,box-shadow .15s}.attendance-action:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 22px #2548682e}.attendance-action small{font-size:11px;font-weight:400;opacity:.9}.attendance-action span{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600}.attendance-action svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.action-in{background:linear-gradient(145deg,#159b67,#08754d)}.action-out{background:linear-gradient(145deg,#e05d54,#b53b3b)}.attendance-action:disabled{cursor:default;background:#71869c;box-shadow:none;opacity:.72}.times{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 18px}.time-box{padding:13px 15px;border:1px solid #e0e7ef;border-radius:12px;background:#f6f8fb}.time-box small{display:block;margin-bottom:7px;color:#6e839b;font-size:11px}.time-box strong{font-size:24px;color:#183d67;font-variant-numeric:tabular-nums}.message{min-height:24px;margin:0;padding:0 20px 22px;color:#14805a;font-size:12px}.message.error{color:#bd3e3e}.confirm-dialog{width:min(420px,calc(100vw - 32px));padding:0;border:0;border-radius:18px;color:#173a60;font-family:inherit;box-shadow:0 24px 80px #10294355}.confirm-dialog::backdrop{background:#10294380}.confirm-body{padding:26px}.confirm-icon{display:grid;place-items:center;width:54px;height:54px;margin:auto;border-radius:50%;background:#e8f3ff;color:#165a99;font-size:25px}.confirm-dialog h2{text-align:center;margin:14px 0 6px;font-size:21px}.confirm-dialog p{text-align:center;margin:0;color:#6a8097;font-size:13px;line-height:1.7}.confirm-dialog footer{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.confirm-dialog button{min-height:48px;border:0;border-radius:10px;cursor:pointer}.confirm-cancel{background:#eef2f7;color:#45617d}.confirm-submit{background:#113f70;color:#fff;font-weight:600}@media(max-width:480px){main{padding:24px 14px 36px}.employee-name{font-size:23px}.clock-head{padding:30px 18px 24px}.location-card{margin-inline:14px}.map-wrap{height:160px}.actions,.times{padding-inline:14px}.attendance-action{min-height:105px;padding-inline:8px}.attendance-action span{font-size:13px}.clock-main{font-size:70px}.clock-seconds{font-size:30px}}
.employee-header{margin:0 20px;padding:24px 4px 20px;border-bottom:1px solid #e3eaf3}.employee-header .branch{margin:8px 0 0;line-height:1.7;overflow-wrap:anywhere}.employee-header .employee-name{overflow-wrap:anywhere}.clock-head{padding-top:28px}@media(max-width:480px){.employee-header{margin-inline:14px;padding:22px 4px 18px}.clock-head{padding-top:26px}}</style></head><body><main><section class="clock-card" aria-label="ลงเวลาวันนี้"><header class="employee-header"><p class="eyebrow">ลงเวลาประจำวัน</p><h1 class="employee-name" id="name">กำลังโหลดข้อมูล…</h1><p class="branch" id="branch">กรุณาเข้าสู่ระบบ</p></header><div class="clock-head"><div class="clock" role="timer" aria-label="เวลาประเทศไทย"><span class="clock-main" id="clockMain">--:--</span><span class="clock-seconds" id="clockSeconds">:--</span></div><div class="date" id="today"></div></div><section class="location-card" aria-label="ตำแหน่งล่าสุด"><div class="location-head"><div class="location-title"><span class="pin" aria-hidden="true">⌖</span><div>ตำแหน่งล่าสุดของฉัน<p class="location-state" id="locationState">กำลังรอข้อมูล GPS</p></div></div><button type="button" class="refresh-location" id="refreshLocation">ตรวจตำแหน่ง</button></div><div class="map-wrap" id="mapWrap"><div class="map-empty"><strong>ยังไม่พบตำแหน่ง</strong><span>กดตรวจตำแหน่งและอนุญาต GPS</span></div></div><div class="accuracy" id="accuracy">ตำแหน่งนี้จะถูกตรวจซ้ำโดยเซิร์ฟเวอร์ก่อนบันทึกเวลา</div></section><div class="actions"><button type="button" id="attendance" class="attendance-action action-in" disabled><small id="checkinState">รอตรวจตำแหน่ง</small><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>ลงเวลาเข้างาน</span></button><button type="button" id="attendanceOut" class="attendance-action action-out" disabled><small id="checkoutState">รอตรวจตำแหน่ง</small><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M9 12h12m-4-4 4 4-4 4"/></svg>ลงเวลาออกงาน</span></button></div><div class="times"><div class="time-box"><small>เวลาเข้างาน</small><strong id="checkin">--:--</strong></div><div class="time-box"><small>เวลาออกงาน</small><strong id="checkout">--:--</strong></div></div><p class="message" id="message" role="status" aria-live="polite"></p></section></main><dialog class="confirm-dialog" id="confirmDialog" aria-labelledby="confirmTitle"><div class="confirm-body"><div class="confirm-icon" aria-hidden="true">✓</div><h2 id="confirmTitle">ยืนยันการลงเวลา</h2><p id="confirmText"></p><footer><button type="button" class="confirm-cancel" id="confirmCancel">ยกเลิก</button><button type="button" class="confirm-submit" id="confirmSubmit">ยืนยัน</button></footer></div></dialog><script>window.BP_LIFF_ID='2011802874-VSvGPhi7';</script><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="auth.js"></script><script>
let account=null,busy=false,serverOffset=0,latestPosition=null,pendingType='';const inButton=document.getElementById('attendance'),outButton=document.getElementById('attendanceOut'),message=document.getElementById('message'),dialog=document.getElementById('confirmDialog');function time(value){return value?String(value).includes('T')?String(value).slice(11,16):String(value).slice(0,5):'--:--'}function status(text,error=false){message.textContent=text;message.className='message'+(error?' error':'')}function now(){return new Date(Date.now()+serverOffset)}function updateClock(){const d=now(),parts=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d),part=t=>parts.find(p=>p.type===t)?.value||'--';document.getElementById('clockMain').textContent=part('hour')+':'+part('minute');document.getElementById('clockSeconds').textContent=':'+part('second');document.getElementById('today').textContent=new Intl.DateTimeFormat('th-TH',{timeZone:'Asia/Bangkok',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)}setInterval(updateClock,1000);updateClock();function todayRecord(){return account?.records.find(r=>r.Date===account.today&&r.Status!=='CANCELLED')}function updateActions(){const record=todayRecord(),entered=!!record?.CheckInTime,exited=!!record?.CheckOutTime,hasLocation=!!latestPosition;inButton.disabled=busy||!account||!hasLocation||entered;outButton.disabled=busy||!account||!hasLocation||!entered||exited;document.getElementById('checkinState').textContent=entered?'บันทึกแล้ว '+time(record.CheckInTime):hasLocation?'พร้อมบันทึก':'รอตรวจตำแหน่ง';document.getElementById('checkoutState').textContent=exited?'บันทึกแล้ว '+time(record.CheckOutTime):entered?(hasLocation?'พร้อมบันทึก':'รอตรวจตำแหน่ง'):'ต้องลงเวลาเข้าก่อน';document.getElementById('checkin').textContent=time(record?.CheckInTime);document.getElementById('checkout').textContent=time(record?.CheckOutTime)}function readLocation(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(Error('เบราว์เซอร์ไม่รองรับ GPS'));navigator.geolocation.getCurrentPosition(resolve,e=>reject(Error(e.code===1?'กรุณาอนุญาตตำแหน่งในเบราว์เซอร์':'อ่านตำแหน่งไม่สำเร็จ กรุณาลองใหม่')),{enableHighAccuracy:true,timeout:20000,maximumAge:15000})})}async function locate(){if(busy)return;busy=true;document.getElementById('locationState').textContent='กำลังอ่านตำแหน่ง…';document.getElementById('refreshLocation').disabled=true;try{const p=await readLocation();latestPosition={Latitude:p.coords.latitude,Longitude:p.coords.longitude,Accuracy:p.coords.accuracy};const lat=latestPosition.Latitude.toFixed(6),lng=latestPosition.Longitude.toFixed(6),url='https://www.google.com/maps?q='+encodeURIComponent(lat+','+lng)+'&z=17&output=embed',iframe=document.createElement('iframe');iframe.title='แผนที่ตำแหน่งล่าสุดของฉัน';iframe.loading='lazy';iframe.referrerPolicy='no-referrer-when-downgrade';iframe.src=url;document.getElementById('mapWrap').replaceChildren(iframe);document.getElementById('locationState').textContent=lat+', '+lng;document.getElementById('accuracy').textContent='ความแม่นยำประมาณ '+Math.round(latestPosition.Accuracy)+' เมตร · เซิร์ฟเวอร์จะตรวจพื้นที่สาขาอีกครั้ง';status('ตรวจพบตำแหน่งแล้ว กรุณาเลือกลงเวลา')}catch(e){latestPosition=null;document.getElementById('locationState').textContent='ไม่สามารถอ่านตำแหน่งได้';status(e.message,true)}finally{busy=false;document.getElementById('refreshLocation').disabled=false;updateActions()}}async function load(){inButton.disabled=true;outButton.disabled=true;try{account=await bpServerCall('getAttendanceData');if(account.serverTime){const stamp=Date.parse(account.serverTime+'+07:00');if(Number.isFinite(stamp))serverOffset=stamp-Date.now()}document.getElementById('name').textContent=account.employee.FullName;document.getElementById('branch').textContent=account.branch.BranchName+' · '+account.employee.EmployeeID;updateClock();updateActions();await locate()}catch(e){account=null;status(e.message,true);updateActions()}}function ask(type){if(busy||!account||!latestPosition)return;pendingType=type;const entering=type==='in';document.getElementById('confirmTitle').textContent=entering?'ยืนยันลงเวลาเข้างาน':'ยืนยันลงเวลาออกงาน';document.getElementById('confirmText').textContent='บันทึกเวลา '+document.getElementById('clockMain').textContent+document.getElementById('clockSeconds').textContent+' จากตำแหน่งล่าสุดที่แสดงบนแผนที่หรือไม่';document.getElementById('confirmSubmit').textContent=entering?'ยืนยันเข้างาน':'ยืนยันออกงาน';dialog.showModal()}async function recordAttendance(){if(!pendingType||busy||!latestPosition)return;const type=pendingType;dialog.close();busy=true;updateActions();status('กำลังตรวจสอบพื้นที่สาขา…');try{await bpServerCall('attendance',{EmployeeID:account.employee.EmployeeID,type,...latestPosition});status(type==='in'?'บันทึกเวลาเข้างานสำเร็จ':'บันทึกเวลาออกงานสำเร็จ');latestPosition=null;await load()}catch(e){status(e.message,true)}finally{busy=false;pendingType='';updateActions()}}inButton.onclick=()=>ask('in');outButton.onclick=()=>ask('out');document.getElementById('refreshLocation').onclick=locate;document.getElementById('confirmCancel').onclick=()=>{pendingType='';dialog.close()};document.getElementById('confirmSubmit').onclick=recordAttendance;dialog.addEventListener('cancel',()=>{pendingType=''});load();
</script></body></html>
